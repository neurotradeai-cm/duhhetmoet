<style>
:root{--bg:#0b1220;--panel:#131c2e;--line:#243247;--txt:#e6edf7;--dim:#93a4bd;--acc:#38bdf8;--ok:#22c55e;--warn:#f59e0b;--err:#ef4444;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font:16px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:96px;}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);z-index:20;}
header h1{font-size:17px;margin:0;flex:1;}
header button{width:auto;padding:8px 12px;}
.wrap{padding:14px;}
.card-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;}
label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
select,input,textarea,button{font:inherit;color:var(--txt);background:#0d1524;border:1px solid var(--line);border-radius:12px;padding:13px 12px;width:100%;}
select{font-size:16px;}
textarea{min-height:90px;resize:vertical;font:13px/1.4 ui-monospace,Consolas,monospace;}
optgroup{color:var(--dim);font-size:13px;}
button{cursor:pointer;background:#1b2a42;border-color:#2c4160;}
button:disabled{opacity:.5;}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:4px;}
.seg.two{grid-template-columns:1fr 1fr;}
.seg.four{grid-template-columns:1fr 1fr;}
.seg button{padding:13px 6px;font-size:14px;}
.seg button.on{background:var(--acc);color:#04121f;border-color:var(--acc);font-weight:700;}
.big{width:100%;padding:16px;font-size:17px;font-weight:700;border-radius:14px;margin-top:12px;}
.primary{background:var(--acc);color:#04121f;border-color:var(--acc);}
.ok{background:var(--ok);color:#04121f;border-color:var(--ok);}
.share{background:#7c3aed;color:#fff;border-color:#7c3aed;}
.danger{background:#3a1a1a;border-color:#5b2626;}
.bar{height:12px;background:#0d1524;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:12px;}
.bar>i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s;}
.count{text-align:center;font-size:22px;font-weight:700;color:var(--acc);margin-top:10px;}
.count small{display:block;font-size:12px;color:var(--dim);font-weight:400;}
.item{background:#0d1524;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;flex-direction:column;gap:3px;}
.item .nm{font-weight:600;}
.item .ph{font-size:18px;color:var(--acc);text-decoration:none;font-weight:700;}
.item .mt{font-size:12px;color:var(--dim);}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);margin-left:6px;}
.badge.mobiel{color:#86efac;border-color:#22603c;}
.badge.vast{color:#7dd3fc;border-color:#1e5f80;}
.badge.zakelijk{color:#fcd34d;border-color:#6b5312;}
.badge.particulier{color:#c4b5fd;border-color:#4c3f80;}
#log{height:150px;overflow:auto;background:#08101c;border:1px solid var(--line);border-radius:12px;padding:8px;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;}
.l-warn{color:var(--warn);}.l-err{color:var(--err);}.l-ok{color:var(--ok);}.l-dim{color:var(--dim);}
.hint{font-size:12px;color:var(--dim);margin-top:8px;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ok);color:#04121f;font-weight:700;padding:12px 18px;border-radius:12px;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}
.hide{display:none;}
.row2{display:flex;gap:8px;margin-top:10px;}
.row2 button{width:auto;flex:1;}
.srcgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.srcgrid label{display:flex;align-items:center;gap:8px;font-size:13px;text-transform:none;letter-spacing:0;color:var(--txt);background:#0d1524;border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin:0;cursor:pointer;}
.srcgrid input{width:auto;padding:0;transform:scale(1.2);}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;text-transform:none;letter-spacing:0;color:var(--txt);background:#0d1524;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:0;cursor:pointer;}
.chk input{width:auto;padding:0;transform:scale(1.25);}

/* ================= NUMMER-HELPERS ================= */
function normPhone(p){let s=String(p||"").replace(/[^\d+]/g,"");if(s.startsWith("+32"))s="0"+s.slice(3);else if(s.startsWith("0032"))s="0"+s.slice(4);return s;}
function isBelgian(p){const s=normPhone(p);return /^0\d{8}$/.test(s);}
function phoneType(p){const s=normPhone(p);if(/^04\d{8}$/.test(s))return "mobiel";if(/^0\d{8}$/.test(s))return "vast";return "onbekend";}
function toPlus32(p){const s=normPhone(p);
  if(/^04\d{8}$/.test(s))return "+32 "+s.slice(1,4)+" "+s.slice(4,6)+" "+s.slice(6,8)+" "+s.slice(8,10);
  if(/^0(2|3|4|9)\d{7}$/.test(s))return "+32 "+s.slice(1,3)+" "+s.slice(3,5)+" "+s.slice(5,7)+" "+s.slice(7,9);
  if(/^0\d{8}$/.test(s))return "+32 "+s.slice(1,4)+" "+s.slice(4,6)+" "+s.slice(6,8)+" "+s.slice(8,9);
  return String(p||"");}
function extractPhones(text){const out=[];let m,re1=/href=["']tel:([^"']+)/gi;while((m=re1.exec(text)))out.push(m[1]);
  const plain=String(text).replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ");
  const re2=/(\+?\d[\d\s().\/-]{6,18}\d)/g;
  while((m=re2.exec(plain))){const raw=m[1].replace(/\s+/g," ").trim();const d=raw.replace(/\D/g,"");if(d.length>=8&&d.length<=15)out.push(raw);}
  return [...new Set(out.map(x=>x.trim()))];}
const pageTitle=t=>{const m=String(t).match(/<title[^>]*>([\s\S]*?)<\/title>/i);return m?m[1].replace(/\s+/g," ").trim():"";};
function absLinks(html,base){const out=[];let m,re=/href=["']([^"'#]+)["']/gi;
  while((m=re.exec(html))){let u=m[1];if(u.startsWith("//"))u="https:"+u;else if(u.startsWith("/")){try{u=new URL(u,base).href;}catch(e){continue;}}if(/^https?:\/\//.test(u))out.push(u);}
  return out;}
function goodUrl(u){try{const h=new URL(u).hostname;if(/\.(png|jpe?g|svg|gif|css|js|pdf|ico|woff2?|webp|mp4|zip|xml)$/i.test(u))return false;

/* ================= OVERPASS ================= */
async function overpassPost(ep,q){const res=await fetch(ep,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(q),signal:(state.ctrl=new AbortController()).signal});
  if(!res.ok)throw new Error("HTTP "+res.status);const t=await res.text();if(/runtime error/i.test(t))throw new Error("bezet");
  const j=JSON.parse(t);if(!j.elements)throw new Error("leeg");return j;}
async function overpassGet(ep,q){const res=await fetch(ep+"?data="+encodeURIComponent(q),{signal:(state.ctrl=new AbortController()).signal});
  if(!res.ok)throw new Error("HTTP "+res.status);const t=await res.text();if(/runtime error/i.test(t))throw new Error("bezet");
  const j=JSON.parse(t);if(!j.elements)throw new Error("leeg");return j;}
async function overpass(query,tries=6,wantData=true){let lastErr=null,emptyRes=null;
  for(let a=0;a<tries;a++){for(let i=0;i<ENDPOINTS.length;i++){if(state.abort)throw new Error("abort");const ep=ENDPOINTS[(i+a)%ENDPOINTS.length];
    try{const j=await overpassPost(ep,query);if(wantData&&j.elements.length===0){emptyRes=j;await sleep(120);continue;}return j;}
    catch(e){if(state.abort)throw new Error("abort");lastErr=e;await sleep(200);
      try{const j=await overpassGet(ep,query);if(wantData&&j.elements.length===0){emptyRes=j;continue;}return j;}catch(e2){lastErr=e2;await sleep(150);}}}
    if(emptyRes)return emptyRes;}
  if(emptyRes)return emptyRes;throw lastErr||new Error("alle mirrors faalden");}
async function fetchVia(url,firstKey){const order=[firstKey,...PROXY_ORDER.filter(k=>k!==firstKey)];let err;
  for(let r=0;r<2;r++)for(const key of order){if(state.abort)throw new Error("abort");
    try{const res=await fetch(PROXIES[key](url),{signal:(state.ctrl=new AbortController()).signal});if(!res.ok)throw new Error("HTTP "+res.status);
      const txt=await res.text();if(txt&&txt.length>40)return{txt,proxy:key};throw new Error("leeg");}catch(e){err=e;}}
  throw err;}

/* ================= QUERIES ================= */
function qFindArea(){const p=REGIONS[$("regio").value];
  if(p.rel)return `[out:json][timeout:120];rel(${p.rel});out ids;`;
  const scope=p.inBE?`area["ISO3166-1"="BE"][admin_level=2]->.b;`:"";const inA=p.inBE?"(area.b)":"";
  const lvl=(p.kind==="stad-vl"||p.kind==="stad-wa")?`["admin_level"~"^(7|8)$"]`:`["admin_level"="${p.admin}"]`;
  return `[out:json][timeout:120];${scope}rel["boundary"="administrative"]${lvl}["name"~"^${p.name}$",i]${inA};out ids;`;}
const qChildren=(a,l)=>`[out:json][timeout:300];area(${a})->.a;rel["boundary"="administrative"]["admin_level"]="${l}"](area.a);out tags;`;
const qData=(a,to,extra="")=>`[out:json][timeout:${to}];area(${a})->.a;(node[~"^(contact:)?(phone|mobile)$"~"."]${extra}(area.a);way[~"^(contact:)?(phone|mobile)$"~"."]${extra}(area.a);relation[~"^(contact:)?(phone|mobile)$"~"."]${extra}(area.a););out center tags;`;
const qCount=(a,extra="")=>qData(a,120,extra).replace("out center tags;","out count;");

function isBusiness(t){return !!(t.name||t.shop||t.amenity||t.office||t.craft||t.healthcare||t.tourism||t.leisure||t.industrial||t.company);}
function parseOsm(els,cityHint){const out=[];for(const el of els){const t=el.tags||{};const phone=t.phone||t["contact:phone"]||t.mobile||t["contact:mobile"]||t["phone:BE"]||t.whatsapp||"";
  out.push({source:"osm",id:"osm/"+el.type+"/"+el.id,name:t.name||"",phone,type:phoneType(phone),cat:isBusiness(t)?"zakelijk":"particulier",street:t["addr:street"]||"",housenumber:t["addr:housenumber"]||"",postcode:t["addr:postcode"]||"",city:t["addr:city"]||cityHint||"",url:t.website||t["contact:website"]||""});}return out;}

function addItem(it){if(!it.phone)return false;if(!isBelgian(it.phone))return false;
  if(state.mode==="mobiel"&&it.type!=="mobiel")return false;if(state.mode==="vast"&&it.type!=="vast")return false;
  if(state.cat!=="alles"&&it.cat!=="onbekend"&&it.cat!==state.cat)return false;
  if(state.net&&it.type==="vast"&&!normPhone(it.phone).startsWith(state.net))return false;
  const alt=(it.phone+"|"+it.street+"|"+it.housenumber+"|"+it.name).toLowerCase();
  if(state.seen.has(it.id)||state.seen.has(alt))return false;state.seen.add(it.id);state.seen.add(alt);state.items.push(it);return true;}

/* ================= HARVEST (webpagina's) ================= */
async function harvest(urls,label,source){let idx=0;const seenU=new Set();let n=0;
  async function worker(){while(idx<urls.length&&!state.abort){const u=urls[idx++];if(seenU.has(u))continue;seenU.add(u);
    try{const {txt}=await fetchVia(u,"allorigins");const title=pageTitle(txt);
      for(const ph of extractPhones(txt))if(addItem({source,id:source+"|"+u+"|"+ph,name:title,phone:ph,type:phoneType(ph),cat:"onbekend",street:"",housenumber:"",postcode:"",city:"",url:u}))n++;}catch(e){}
    state.prog++;progress(Math.min(99,state.prog/state.progTotal*100));updateCount();render();await sleep(60);}}
  await Promise.all(Array.from({length:4},worker));log(label+": +"+n,"ok");}

/* ================= BRON: OSM ================= */
async function runOsm(){const p=REGIONS[$("regio").value];let areaId=null;
  for(let a=0;a<8&&!state.abort&&!areaId;a++){try{const fa=await overpass(qFindArea(),4);areaId=p.rel?(3600000000+p.rel):(fa.elements[0]?3600000000+fa.elements[0].id:null);}catch(e){log("Gebied zoeken… ("+e.message+")","warn");await sleep(1200);}}
  if(!areaId)throw new Error("Gebied niet gevonden");log("Gebied gevonden.","ok");
  let list=[];for(let a=0;a<8&&!state.abort&&!list.length;a++){try{const ch=await overpass(qChildren(areaId,$("chunkLevel").value),4);list=ch.elements.map(e=>({id:3600000000+e.id,name:(e.tags&&e.tags.name)||""}));}catch(e){log("Gebieden ophalen… ("+e.message+")","warn");await sleep(1200);}}
  if(!list.length)list=[{id:areaId,name:(p.name||"(geheel)")}];state.progTotal+=list.length;
  let queue=list.slice(),round=0,added=0;
  while(queue.length&&!state.abort&&round<3){round++;const failed=[];
    for(const m of queue){if(state.abort)break;try{const d=await overpass(qData(m.id,180,state.osmExtra),6);for(const it of parseOsm(d.elements,m.name))if(addItem(it))added++;}catch(e){failed.push(m);}
      state.prog++;progress(Math.min(99,state.prog/state.progTotal*100));updateCount();render();await sleep(120);}
    queue=failed;state.failed=queue.slice();if(queue.length)log(queue.length+" gebieden opnieuw…","warn");await sleep(1000);}
  log("OSM: +"+added+" nummers","ok");}

/* ================= BRON: WIKIDATA ================= */
const wdtQuery=(qid,limit)=>`SELECT ?item ?itemLabel ?phone ?street ?postcode ?cityLabel WHERE { ?item wdt:P17 wd:${qid}; wdt:P1329 ?phone. OPTIONAL { ?item wdt:P669 ?street. } OPTIONAL { ?item wdt:P281 ?postcode. } OPTIONAL { ?item wdt:P131 ?city. } SERVICE wikibase:label { bd:serviceParam wikibase:language "nl,fr,en". } } LIMIT ${limit}`;
async function runWikidata(){for(let a=0;a<4&&!state.abort;a++){try{log("Wikidata…");
  const res=await fetch("https://query.wikidata.org/sparql",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded",Accept:"application/sparql-results+json"},body:"query="+encodeURIComponent(wdtQuery("Q31",8000))});
  if(!res.ok)throw new Error("HTTP "+res.status);const j=await res.json();let n=0;
  for(const b of j.results.bindings){const phone=b.phone?.value||"";if(addItem({source:"wikidata",id:"wdt/"+b.item.value,name:b.itemLabel?.value||"",phone,type:phoneType(phone),cat:"zakelijk",street:b.street?.value||"",housenumber:"",postcode:b.postcode?.value||"",city:b.cityLabel?.value||"",url:""}))n++;}
  log("Wikidata: +"+n,"ok");return;}catch(e){log("Wikidata… ("+e.message+")","warn");await sleep(1200);}}}

/* ================= BRON: WIKIPEDIA (geosearch) ================= */
async function runWikipedia(){const p=REGIONS[$("regio").value];let lat=null,lon=null;
  try{const r=await fetchVia("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=be&q="+encodeURIComponent((p.name||p.label).replace(/\s*\(.*\)$/,"")),"allorigins");
    const j=JSON.parse(r.txt);if(j[0]){lat=j[0].lat;lon=j[0].lon;}}catch(e){}
  if(lat===null){log("Wikipedia: geen coördinaten","warn");return;}
  let titles=[];try{const gs=await fetchVia("https://nl.wikipedia.org/w/api.php?action=query&list=geosearch&gscoord="+lat+"%7C"+lon+"&gsradius=10000&gslimit=300&format=json","allorigins");
    const gj=JSON.parse(gs.txt);titles=(gj.query&&gj.query.geosearch||[]).map(x=>x.title);}catch(e){log("Wikipedia… ("+e.message+")","warn");return;}
  let n=0;for(let i=0;i<titles.length&&!state.abort;i+=20){const batch=titles.slice(i,i+20);
    try{const r=await fetchVia("https://nl.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&exlimit=20&format=json&titles="+encodeURIComponent(batch.join("|")),"allorigins");
      const j=JSON.parse(r.txt);const pages=j.query&&j.query.pages||{};
      for(const k in pages){const pg=pages[k];const txt=pg.extract||"";const title=pg.title||"";
        for(const ph of extractPhones(txt))if(addItem({source:"wikipedia",id:"wiki/"+title+"|"+ph,name:title,phone:ph,type:phoneType(ph),cat:"onbekend",street:"",housenumber:"",postcode:"",city:"",url:"https://nl.wikipedia.org/wiki/"+encodeURIComponent(title)}))n++;}}catch(e){}
    state.prog++;progress(Math.min(99,state.prog/state.progTotal*100));updateCount();render();await sleep(80);}
  log("Wikipedia: +"+n,"ok");}

/* ================= BRONNEN: ZOEKMACHINES ================= */
function linksDdg(t){return [...t.matchAll(/uddg=([^&"']+)/g)].map(m=>dec(m[1]));}
function linksGeneric(t,base){return absLinks(t,base||"https://x/").filter(goodUrl);}
const ENGINES={
  ddg:{label:"DuckDuckGo",u:q=>"https://html.duckduckgo.com/html/?q="+encodeURIComponent(q),links:linksDdg},
  bing:{label:"Bing",u:q=>"https://www.bing.com/search?q="+encodeURIComponent(q)+"&count=40",links:t=>linksGeneric(t,"https://www.bing.com/")},
  mojeek:{label:"Mojeek",u:q=>"https://www.mojeek.com/search?q="+encodeURIComponent(q),links:t=>linksGeneric(t,"https://www.mojeek.com/")},
  brave:{label:"Brave Search",u:q=>"https://search.brave.com/search?q="+encodeURIComponent(q),links:t=>linksGeneric(t,"https://search.brave.com/")},
  ecosia:{label:"Ecosia",u:q=>"https://www.ecosia.org/search?q="+encodeURIComponent(q),links:t=>linksGeneric(t,"https://www.ecosia.org/")}
};
function buildQuery(){const p=REGIONS[$("regio").value];const base=(p.label||"").replace(/\s*\(.*\)$/,"");
  const kw=$("kw").value.trim();const extra=(state.target==="particulier")?" vast telefoon":(state.target==="zorg"?" telefoon dokter apotheek rusthuis":" telefoon");
  return (kw?kw+" ":"")+base+extra;}
async function runEngine(key){const e=ENGINES[key];const q=buildQuery();let urls=[],txt="";
  try{const r=await fetchVia(e.u(q),"allorigins");txt=r.txt;urls=e.links(txt).filter(goodUrl);}catch(err){log(e.label+": "+err.message,"warn");return;}
  let n=0;const title=e.label+": "+q;
  for(const ph of extractPhones(txt))if(addItem({source:key+"-serp",id:key+"-serp|"+ph,name:title,phone:ph,type:phoneType(ph),cat:"onbekend",street:"",housenumber:"",postcode:"",city:"",url:""}))n++;
  urls=[...new Set(urls)].slice(0,50);
  if(urls.length){state.progTotal+=urls.length;await harvest(urls,e.label,key);}
  else log(e.label+": +"+n+" (uit snippets)","ok");}

/* ================= BRON: WEBSITES (uit OSM) ================= */
const CONTACT_PATHS=["","/contact","/contact-us","/contacteer","/contacteer-ons","/over-ons","/about","/nl/contact","/fr/contact","/contact.html","/contact.php"];
async function runWebsites(){let bases=[...new Set(state.items.filter(x=>x.source==="osm"&&x.url).map(x=>x.url).filter(u=>/^https?:\/\//.test(u)))].slice(0,120);
  if(!bases.length){log("Websites: geen OSM-links","warn");return;}
  const urls=[];for(const b of bases){for(const pth of CONTACT_PATHS.slice(0,4)){try{urls.push(new URL(pth,b).href);}catch(e){}}}
  state.progTotal+=urls.length;await harvest([...new Set(urls)],"Websites","site");}

/* ================= BRON: SITEMAPS ================= */
async function runSitemaps(){const bases=[...new Set(state.items.filter(x=>x.source==="osm"&&x.url).map(x=>x.url).filter(u=>/^https?:\/\//.test(u)))].slice(0,60);
  const urls=[];
  for(const b of bases){if(state.abort)break;
    try{const {txt}=await fetchVia(new URL("/sitemap.xml",b).href,"allorigins");
      const locs=[...txt.matchAll(/<loc>\s*([^<\s]+)\s*<\/loc>/gi)].map(m=>m[1]).filter(u=>/contact|over-ons|about|team/i.test(u)).slice(0,6);
      for(const u of locs)urls.push(u);}catch(e){}
    await sleep(40);}
  if(!urls.length){log("Sitemaps: niets gevonden","warn");return;}
  state.progTotal+=urls.length;await harvest([...new Set(urls)],"Sitemaps","sitemap");}

  if(!urls.length){log("Eigen URL's: niets","warn");return;}

/* ================= BESTAND OPSLAAN (mobiel-vriendelijk) ================= */
async function saveFile(name,text,type,useShare){
  const blob=new Blob([text],{type});
  const file=(typeof File!=="undefined")?new File([blob],name,{type}):null;
  if(useShare&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});return true;}catch(e){if(e&&e.name==="AbortError")return true;}
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=name;a.rel="noopener";a.style.display="none";
  document.body.appendChild(a);
  try{a.click();}catch(e){window.open(url,"_blank");}
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},6000);
  return true;
}

/* ================= EXPORT (CSV + TXT + delen) ================= */
function buildExport(fmt){const list=state.items.slice().sort((a,b)=>(a.city||"").localeCompare(b.city||"","nl"));
  const d=new Date().toISOString().slice(0,10);
  const base="nummers_"+$("regio").value+"_"+state.target+"_"+state.mode+"_"+d;
  if(fmt==="csv"){
    const head=["naam","telefoon","type","soort","bron","straat","nummer","postcode","gemeente","url"];
    const rows=[head.join(";")].concat(list.map(x=>[x.name,toPlus32(x.phone),x.type,x.cat,x.source,x.street,x.housenumber,x.postcode,x.city,x.url].map(v=>{let s=String(v||"").replace(/;/g,",");if(s.includes('"'))s='"'+s.replace(/"/g,'""')+'"';return s;}).join(";")));
    return {name:base+".csv",text:"\uFEFF"+rows.join("\r\n"),type:"text/csv;charset=utf-8"};
  }
  const head=["telefoon","naam","type","soort","gemeente","bron"];
  const lines=[head.join("\t")].concat(list.map(x=>[toPlus32(x.phone),x.name,x.type,x.cat,x.city,x.source].map(v=>String(v||"").replace(/\t/g," ")).join("\t")));
  return {name:base+".txt",text:"\uFEFF"+lines.join("\r\n"),type:"text/plain;charset=utf-8"};
}
async function doExport(fmt,wipe=true,useShare=false){if(!state.items.length){toast("Nog geen nummers");return;}
  const f=buildExport(fmt);
  await saveFile(f.name,f.text,f.type,useShare);
  toast((useShare?"Klaar om op te slaan":("Geëxporteerd ("+fmt+")"))+": "+state.items.length+" nummers");
  log("Bestand: "+f.name+" ("+state.items.length+")","ok");
  if(wipe){resetAll();log("Lijst gewist — nieuwe zoektocht.","ok");}}

/* ================= EVENTS ================= */
$("regio").innerHTML=GROUP_ORDER.map(([k,label])=>{const items=Object.entries(REGIONS).filter(([,v])=>v.kind===k);
  return items.length?`<optgroup label="${esc(label)}">`+items.map(([id,v])=>`<option value="${id}">${esc(v.label)}</option>`).join("")+`</optgroup>`:"";}).join("");
$("regio").value="vlaanderen";
$("net").innerHTML=NETS.map(n=>`<option value="${n?n.slice(0,3).trim():""}">${n||"— geen filter —"}</option>`).join("");
$("srcgrid").innerHTML=Object.entries(SOURCES).map(([k,v])=>`<label><input type="checkbox" data-s="${k}" ${v.def?"checked":""}>${esc(v.label)}</label>`).join("");
document.querySelectorAll("#srcgrid input").forEach(c=>{if(c.checked)enabled.add(c.dataset.s);c.onchange=()=>{c.checked?enabled.add(c.dataset.s):enabled.delete(c.dataset.s);};});

document.querySelectorAll(".seg button[data-t]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".seg button[data-t]").forEach(x=>x.classList.remove("on"));b.classList.add("on");state.target=b.dataset.t;
  if(state.target==="particulier"){state.cat="particulier";}else if(state.target==="zakelijk"){state.cat="zakelijk";}else{state.cat="alles";}
  state.osmExtra=(state.target==="zorg")?`["amenity"~"^(pharmacy|doctors|clinic|hospital|dentist|veterinary|nursing_home)$"]`:"";
  document.querySelectorAll(".seg button[data-c]").forEach(x=>x.classList.toggle("on",x.dataset.c===state.cat));
});
document.querySelectorAll(".seg button[data-m]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".seg button[data-m]").forEach(x=>x.classList.remove("on"));b.classList.add("on");state.mode=b.dataset.m;});
$("net").onchange=()=>state.net=$("net").value;
$("btnStart").onclick=run;
$("btnStop").onclick=()=>{state.abort=true;if(state.ctrl)state.ctrl.abort();log("Stop…","warn");};
$("btnExportCsv").onclick=()=>doExport("csv",true,false);
$("btnExportTxt").onclick=()=>doExport("txt",true,false);
$("btnShare").onclick=()=>doExport($("autoFmt").value,true,true);
$("btnClear").onclick=()=>{resetAll();log("Gewist.","ok");};
$("btnTest").onclick=testAll;
$("btnAdv").onclick=()=>$("advPanel").classList.toggle("hide");
$("fileIn").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.fileTxt=String(r.result||"");log("Bestand geladen ("+f.name+").","ok");};r.readAsText(f);};

/* op gsm automatische download standaard aanzetten */
if(isMobile)$("autoDl").checked=true;

updateCount();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
