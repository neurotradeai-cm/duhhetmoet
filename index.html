<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>+32 Nummerzoeker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0b1220">
<style>
:root{--bg:#0b1220;--panel:#131c2e;--line:#243247;--txt:#e6edf7;--dim:#93a4bd;--acc:#38bdf8;--ok:#22c55e;--warn:#f59e0b;--err:#ef4444;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font:16px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:96px;}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);z-index:20;}
header h1{font-size:17px;margin:0;flex:1;}
header button{width:auto;padding:8px 12px;}
.wrap{padding:14px;}
.card-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;}
label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
select,input,button{font:inherit;color:var(--txt);background:#0d1524;border:1px solid var(--line);border-radius:12px;padding:13px 12px;width:100%;}
select{font-size:16px;}
button{cursor:pointer;background:#1b2a42;border-color:#2c4160;}
button:disabled{opacity:.5;}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:4px;}
.seg button{padding:14px 6px;font-size:15px;}
.seg button.on{background:var(--acc);color:#04121f;border-color:var(--acc);font-weight:700;}
.big{width:100%;padding:16px;font-size:17px;font-weight:700;border-radius:14px;margin-top:12px;}
.primary{background:var(--acc);color:#04121f;border-color:var(--acc);}
.ok{background:var(--ok);color:#04121f;border-color:var(--ok);}
.danger{background:#3a1a1a;border-color:#5b2626;}
.bar{height:12px;background:#0d1524;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:12px;}
.bar>i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s;}
.count{text-align:center;font-size:22px;font-weight:700;color:var(--acc);margin-top:10px;}
.count small{display:block;font-size:12px;color:var(--dim);font-weight:400;}
.item{background:#0d1524;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;flex-direction:column;gap:3px;}
.item .nm{font-weight:600;}
.item .ph{font-size:18px;color:var(--acc);text-decoration:none;font-weight:700;}
.item .mt{font-size:12px;color:var(--dim);}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);margin-left:6px;}
.badge.mobiel{color:#86efac;border-color:#22603c;}
.badge.vast{color:#7dd3fc;border-color:#1e5f80;}
#log{height:130px;overflow:auto;background:#08101c;border:1px solid var(--line);border-radius:12px;padding:8px;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;}
.l-warn{color:var(--warn);}.l-err{color:var(--err);}.l-ok{color:var(--ok);}.l-dim{color:var(--dim);}
.hint{font-size:12px;color:var(--dim);margin-top:8px;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ok);color:#04121f;font-weight:700;padding:12px 18px;border-radius:12px;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}
.hide{display:none;}
.row2{display:flex;gap:8px;margin-top:10px;}
.row2 button{width:auto;flex:1;}
</style>
</head>
<body>
<header>
  <h1>+32 Nummerzoeker</h1>
  <button id="btnAdv">⚙</button>
</header>

<div class="wrap">
  <div class="card-panel">
    <label>Regio</label>
    <select id="regio"></select>

    <label style="margin-top:12px">Soort nummer</label>
    <div class="seg">
      <button data-m="mobiel">Mobiel</button>
      <button data-m="vast">Vaste lijn</button>
      <button data-m="alles" class="on">Alles</button>
    </div>

    <button id="btnStart" class="big primary">▶ Start zoeken</button>
    <button id="btnStop" class="big danger hide">■ Stop</button>

    <div class="bar"><i id="bar"></i></div>
    <div class="count"><span id="cnt">0</span><small>nummers gevonden</small></div>
  </div>

  <div class="card-panel" id="resPanel">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
      <label style="margin:0">Resultaten</label>
      <span id="resCount" style="font-size:12px;color:var(--dim)">0</span>
    </div>
    <div id="list" style="margin-top:10px"></div>
    <button id="btnExport" class="big ok">⬇ Exporteer (CSV) + nieuwe zoektocht</button>
    <div class="hint">Na export wordt de lijst gewist en kun je direct opnieuw starten.</div>
  </div>

  <div class="card-panel hide" id="advPanel">
    <label>Geavanceerd</label>
    <div class="row2" style="flex-wrap:wrap">
      <button id="btnTest">⚡ Test verbinding</button>
      <button id="btnClear">Wissen</button>
    </div>
    <label style="margin-top:12px">Extra bronnen</label>
    <div class="seg" style="grid-template-columns:1fr 1fr;">
      <button id="tSites" data-on="0">Websites uit OSM</button>
      <button id="tDdg" data-on="0">DuckDuckGo</button>
    </div>
    <label style="margin-top:12px">Fijnmazigheid</label>
    <select id="chunkLevel">
      <option value="6">Snel (grote gebieden)</option>
      <option value="8" selected>Compleet (gemeenten)</option>
    </select>
    <div id="log" style="margin-top:12px"><div class="l-dim">Klaar.</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const ENDPOINTS=["https://overpass-api.de/api/interpreter","https://lz4.overpass-api.de/api/interpreter","https://z.overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
const PROXIES={allorigins:u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),codetabs:u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u),corsproxy:u=>"https://corsproxy.io/?"+encodeURIComponent(u),jina:u=>"https://r.jina.ai/"+u};
const PROXY_ORDER=["allorigins","codetabs","corsproxy","jina"];

const REGIONS={
  belgie:{name:"België (heel)",admin:2,chunk:6},
  vlaanderen:{name:"Vlaanderen",admin:4,rel:53134,chunk:6},
  brussel:{name:"Brussel",admin:4,rel:54094,chunk:8},
  wallonie:{name:"Wallonië",admin:4,rel:90348,chunk:6},
  antwerpen:{name:"Antwerpen",admin:6,chunk:8,inBE:true},
  "oost-vl":{name:"Oost-Vlaanderen",admin:6,chunk:8,inBE:true},
  "west-vl":{name:"West-Vlaanderen",admin:6,chunk:8,inBE:true},
  "vlaams-brabant":{name:"Vlaams-Brabant",admin:6,chunk:8,inBE:true},
  limburg:{name:"Limburg",admin:6,chunk:8,inBE:true},
  henegouwen:{name:"Henegouwen",admin:6,chunk:8,inBE:true},
  luik:{name:"Luik",admin:6,chunk:8,inBE:true},
  namen:{name:"Namen",admin:6,chunk:8,inBE:true},
  "waals-brabant":{name:"Waals-Brabant",admin:6,chunk:8,inBE:true},
  luxemburg:{name:"Luxemburg (BE)",admin:6,chunk:8,inBE:true}
};

const state={running:false,abort:false,items:[],seen:new Set(),ctrl:null,prog:0,progTotal:1,failed:[],mode:"alles"};
let adv={sites:false,ddg:false};

/* ---- nummer-helpers (altijd BE) ---- */
function normPhone(p){let s=String(p||"").replace(/[^\d+]/g,"");if(s.startsWith("+32"))s="0"+s.slice(3);else if(s.startsWith("0032"))s="0"+s.slice(4);return s;}
function isBelgian(p){const s=normPhone(p);return /^0\d{8}$/.test(s)||/^04\d{8}$/.test(s);}
function phoneType(p){const s=normPhone(p);if(/^04\d{8}$/.test(s))return "mobiel";if(/^0\d{8}$/.test(s))return "vast";return "onbekend";}
function toPlus32(p){const s=normPhone(p);
  if(/^04\d{8}$/.test(s))return "+32 "+s.slice(1,4)+" "+s.slice(4,6)+" "+s.slice(6,8)+" "+s.slice(8,10);
  if(/^0(2|3|4|9)\d{7}$/.test(s))return "+32 "+s.slice(1,3)+" "+s.slice(3,5)+" "+s.slice(5,7)+" "+s.slice(7,9);
  if(/^0\d{8}$/.test(s))return "+32 "+s.slice(1,4)+" "+s.slice(4,6)+" "+s.slice(6,8)+" "+s.slice(8,9);
  return String(p||"");}
function extractPhones(text){const out=[];let m,re1=/href=["']tel:([^"']+)/gi;while((m=re1.exec(text)))out.push(m[1]);
  const plain=text.replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ");
  const re2=/(\+?\d[\d\s().\/-]{6,18}\d)/g;
  while((m=re2.exec(plain))){const raw=m[1].replace(/\s+/g," ").trim();const d=raw.replace(/\D/g,"");if(d.length>=8&&d.length<=15)out.push(raw);}
  return [...new Set(out.map(x=>x.trim()))];}
const pageTitle=t=>{const m=t.match(/<title[^>]*>([\s\S]*?)<\/title>/i);return m?m[1].replace(/\s+/g," ").trim():"";};

/* ---- UI ---- */
function log(m,cls=""){const d=document.createElement("div");if(cls)d.className="l-"+cls;d.textContent=m;const L=$("log");L.appendChild(d);while(L.childNodes.length>300)L.removeChild(L.firstChild);L.scrollTop=L.scrollHeight;}
function progress(p){$("bar").style.width=Math.max(0,Math.min(100,p))+"%";}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200);}

/* ---- Overpass met mirror-fix + leegte-detectie ---- */
async function overpass(query,tries=6,wantData=true){let lastErr=null,emptyRes=null;
  for(let a=0;a<tries;a++){for(let i=0;i<ENDPOINTS.length;i++){if(state.abort)throw new Error("abort");const ep=ENDPOINTS[(i+a)%ENDPOINTS.length];
    try{state.ctrl=new AbortController();const res=await fetch(ep,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(query),signal:state.ctrl.signal});
      if(!res.ok)throw new Error("HTTP "+res.status);const t=await res.text();if(/runtime error/i.test(t))throw new Error("bezet");
      const j=JSON.parse(t);if(!j.elements)throw new Error("leeg");if(wantData&&j.elements.length===0){emptyRes=j;await sleep(120);continue;}return j;
    }catch(e){if(state.abort)throw new Error("abort");lastErr=e;await sleep(250);}}
    if(emptyRes)return emptyRes;}
  if(emptyRes)return emptyRes;throw lastErr||new Error("alle mirrors faalden");}
async function fetchVia(url,firstKey){const order=[firstKey,...PROXY_ORDER.filter(k=>k!==firstKey)];let err;
  for(let r=0;r<2;r++)for(const key of order){if(state.abort)throw new Error("abort");
    try{const res=await fetch(PROXIES[key](url),{signal:(state.ctrl=new AbortController()).signal});if(!res.ok)throw new Error("HTTP "+res.status);
      const txt=await res.text();if(txt&&txt.length>40)return{txt,proxy:key};throw new Error("leeg");}catch(e){err=e;}}
  throw err;}

/* ---- queries ---- */
function qFindArea(){const p=REGIONS[$("regio").value];if(p.rel)return `[out:json][timeout:120];rel(${p.rel});out ids;`;
  const scope=p.inBE?`area["ISO3166-1"="BE"][admin_level=2]->.b;`:"";const inA=p.inBE?"(area.b)":"";
  return `[out:json][timeout:120];${scope}rel["boundary"="administrative"]["admin_level"="${p.admin}"]["name"~"${p.name}",i]${inA};out ids;`;}
const qChildren=(a,l)=>`[out:json][timeout:300];area(${a})->.a;rel["boundary"="administrative"]["admin_level"]="${l}"](area.a);out tags;`;
const qData=(a,to)=>`[out:json][timeout:${to}];area(${a})->.a;(node[~"^(contact:)?(phone|mobile)$"~"."](area.a);way[~"^(contact:)?(phone|mobile)$"~"."](area.a);relation[~"^(contact:)?(phone|mobile)$"~"."](area.a););out center tags;`;
const qCount=a=>qData(a,120).replace("out center tags;","out count;");
function parseOsm(els,cityHint){const out=[];for(const el of els){const t=el.tags||{};const phone=t.phone||t["contact:phone"]||t.mobile||t["contact:mobile"]||"";
  out.push({source:"osm",id:"osm/"+el.type+"/"+el.id,name:t.name||"",phone,type:phoneType(phone),street:t["addr:street"]||"",housenumber:t["addr:housenumber"]||"",postcode:t["addr:postcode"]||"",city:t["addr:city"]||cityHint||"",url:t.website||t["contact:website"]||""});}return out;}
function addItem(it){if(!it.phone)return false;if(!isBelgian(it.phone))return false;
  if(state.mode==="mobiel"&&it.type!=="mobiel")return false;if(state.mode==="vast"&&it.type!=="vast")return false;
  const alt=(it.phone+"|"+it.street+"|"+it.housenumber+"|"+it.name).toLowerCase();
  if(state.seen.has(it.id)||state.seen.has(alt))return false;state.seen.add(it.id);state.seen.add(alt);state.items.push(it);return true;}

/* ---- OSM ---- */
async function runOsm(){const p=REGIONS[$("regio").value];let areaId=null;
  for(let a=0;a<8&&!state.abort&&!areaId;a++){try{const fa=await overpass(qFindArea(),4);areaId=p.rel?(3600000000+p.rel):(fa.elements[0]?3600000000+fa.elements[0].id:null);}catch(e){log("Gebied zoeken… ("+e.message+")","warn");await sleep(1200);}}
  if(!areaId)throw new Error("Gebied niet gevonden");log("Gebied gevonden.","ok");
  let list=[];for(let a=0;a<8&&!state.abort&&!list.length;a++){try{const ch=await overpass(qChildren(areaId,$("chunkLevel").value),4);list=ch.elements.map(e=>({id:3600000000+e.id,name:(e.tags&&e.tags.name)||""}));}catch(e){log("Gebieden ophalen… ("+e.message+")","warn");await sleep(1200);}}
  if(!list.length)list=[{id:areaId,name:"(geheel)"}];state.progTotal+=list.length;
  let queue=list.slice(),round=0,added=0;
  while(queue.length&&!state.abort&&round<3){round++;const failed=[];
    for(const m of queue){if(state.abort)break;try{const d=await overpass(qData(m.id,180),6);for(const it of parseOsm(d.elements,m.name))if(addItem(it))added++;}catch(e){failed.push(m);}
      state.prog++;progress(Math.min(99,state.prog/state.progTotal*100));updateCount();render();await sleep(120);}
    queue=failed;state.failed=queue.slice();if(queue.length)log(queue.length+" gebieden opnieuw…","warn");await sleep(1000);}
  log("OSM: +"+added+" nummers","ok");}

/* ---- Wikidata ---- */
const wdtQuery=(qid,limit)=>`SELECT ?item ?itemLabel ?phone ?street ?postcode ?cityLabel WHERE { ?item wdt:P17 wd:${qid}; wdt:P1329 ?phone. OPTIONAL { ?item wdt:P669 ?street. } OPTIONAL { ?item wdt:P281 ?postcode. } OPTIONAL { ?item wdt:P131 ?city. } SERVICE wikibase:label { bd:serviceParam wikibase:language "nl,fr,en". } } LIMIT ${limit}`;
async function runWikidata(){for(let a=0;a<4&&!state.abort;a++){try{log("Wikidata…");
  const res=await fetch("https://query.wikidata.org/sparql",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded",Accept:"application/sparql-results+json"},body:"query="+encodeURIComponent(wdtQuery("Q31",8000))});
  if(!res.ok)throw new Error("HTTP "+res.status);const j=await res.json();let n=0;
  for(const b of j.results.bindings){const phone=b.phone?.value||"";if(addItem({source:"wikidata",id:"wdt/"+b.item.value,name:b.itemLabel?.value||"",phone,type:phoneType(phone),street:b.street?.value||"",housenumber:"",postcode:b.postcode?.value||"",city:b.cityLabel?.value||"",url:""}))n++;}
  log("Wikidata: +"+n,"ok");return;}catch(e){log("Wikidata… ("+e.message+")","warn");await sleep(1200);}}}

/* ---- web scrape ---- */
async function scrapeUrls(urls,label,source){let idx=0;
  async function worker(){while(idx<urls.length&&!state.abort){const u=urls[idx++];
    try{const {txt}=await fetchVia(u,"allorigins");const title=pageTitle(txt);
      for(const ph of extractPhones(txt))addItem({source,id:source+"/"+u+"/"+ph,name:title,phone:ph,type:phoneType(ph),street:"",housenumber:"",postcode:"",city:"",url:u});}catch(e){}
    state.prog++;progress(Math.min(99,state.prog/state.progTotal*100));updateCount();render();await sleep(80);}}
  await Promise.all(Array.from({length:3},worker));log(label+" klaar.","ok");}
async function runDdg(){const raw=REGIONS[$("regio").value].name;let urls=[];
  try{const {txt}=await fetchVia("https://html.duckduckgo.com/html/?q="+encodeURIComponent(raw+" bedrijf telefoon"),"allorigins");
    const uddg=[...txt.matchAll(/uddg=([^&"']+)/g)].map(m=>{try{return decodeURIComponent(m[1]);}catch(e){return m[1];}});
    urls=[...new Set(uddg)].filter(u=>/^https?:\/\//.test(u)&&!/\.(png|jpe?g|svg|gif|css|js|pdf|ico)$/i.test(u)).slice(0,60);}catch(e){log("DuckDuckGo… ("+e.message+")","warn");}
  if(urls.length){state.progTotal+=urls.length;await scrapeUrls(urls,"DuckDuckGo","web");}}

/* ---- weergave ---- */
function updateCount(){$("cnt").textContent=state.items.length.toLocaleString("nl-NL");$("resCount").textContent=state.items.length.toLocaleString("nl-NL")+" zichtbaar";}
function render(){const list=state.items.slice().sort((a,b)=>(a.city||"").localeCompare(b.city||"","nl")||(a.name||"").localeCompare(b.name||"","nl"));
  $("list").innerHTML=list.slice(0,400).map(x=>`<div class="item">
    <div class="nm">${esc(x.name||"(zonder naam)")}<span class="badge ${x.type}">${x.type}</span></div>
    <a class="ph" href="tel:${toPlus32(x.phone).replace(/\s/g,"")}">${esc(toPlus32(x.phone))}</a>
    <div class="mt">${esc([x.street,x.housenumber].filter(Boolean).join(" "))}${x.city?" · "+esc(x.city):""}</div>
  </div>`).join("");
  if(!list.length)$("list").innerHTML='<div class="hint">Nog geen nummers. Kies een regio en druk Start.</div>';}
function resetAll(){state.items=[];state.seen.clear();state.failed=[];state.prog=0;state.progTotal=1;progress(0);updateCount();render();}

/* ---- run ---- */
async function run(){if(state.running)return;state.running=true;state.abort=false;
  $("btnStart").classList.add("hide");$("btnStop").classList.remove("hide");progress(0);log("=== Start ("+state.mode+") ===","ok");
  try{
    await runOsm();
    if(!state.abort)try{await runWikidata();}catch(e){}
    if(adv.sites&&!state.abort){const sites=[...new Set(state.items.filter(x=>x.source==="osm"&&x.url).map(x=>x.url))].filter(u=>/^https?:\/\//.test(u)).slice(0,120);if(sites.length){state.progTotal+=sites.length;await scrapeUrls(sites,"Websites","site");}}
    if(adv.ddg&&!state.abort)try{await runDdg();}catch(e){}
    log("=== Klaar: "+state.items.length+" nummers ===","ok");
  }catch(e){log("Fout: "+e.message,"err");}
  finally{state.running=false;$("btnStart").classList.remove("hide");$("btnStop").classList.add("hide");updateCount();render();if(state.items.length)toast(state.items.length+" nummers gevonden");}}
async function testAll(){$("btnTest").disabled=true;log("--- Test ---");
  try{const p=REGIONS[$("regio").value];const fa=await overpass(qFindArea(),8);const areaId=p.rel?(3600000000+p.rel):3600000000+fa.elements[0].id;
    const c=await overpass(qCount(areaId),8);log("OSM OK: "+(c.elements[0]?.tags?.total||0)+" nummers ✔","ok");
    const {proxy}=await fetchVia("https://example.com","allorigins");log("Proxy OK via "+proxy+" ✔","ok");log("Alles werkt. Druk Start.","ok");}
  catch(e){log("Test: "+e.message,"err");}finally{$("btnTest").disabled=false;}}

/* ---- export ---- */
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function doExport(){if(!state.items.length){toast("Nog geen nummers");return;}
  const list=state.items.slice().sort((a,b)=>(a.city||"").localeCompare(b.city||"","nl"));
  const head=["naam","telefoon","type","straat","nummer","postcode","gemeente"];
  const rows=[head.join(";")].concat(list.map(x=>[x.name,toPlus32(x.phone),x.type,x.street,x.housenumber,x.postcode,x.city].map(v=>{let s=String(v||"").replace(/;/g,",");if(s.includes('"'))s='"'+s.replace(/"/g,'""')+'"';return s;}).join(";")));
  const d=new Date().toISOString().slice(0,10);
  download("nummers_"+$("regio").value+"_"+state.mode+"_"+d+".csv","\uFEFF"+rows.join("\r\n"),"text/csv;charset=utf-8");
  toast("Geëxporteerd: "+list.length+" nummers");log("Geëxporteerd: "+list.length,"ok");
  resetAll();log("Lijst gewist — nieuwe zoektocht.","ok");}

/* ---- events ---- */
$("regio").innerHTML=Object.entries(REGIONS).map(([k,v])=>`<option value="${k}">${esc(v.name)}</option>`).join("");
$("regio").value="vlaanderen";
document.querySelectorAll(".seg button[data-m]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".seg button[data-m]").forEach(x=>x.classList.remove("on"));b.classList.add("on");state.mode=b.dataset.m;});
$("btnStart").onclick=run;
$("btnStop").onclick=()=>{state.abort=true;if(state.ctrl)state.ctrl.abort();log("Stop…","warn");};
